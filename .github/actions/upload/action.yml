name: 'Upload'
description: 'Upload package to server'
inputs:
  url: 
    description: 'Upload URL'
    required: true
  pass:
    description: 'Upload password'
    required: true
  pkg-name:
    description: 'Name of the file to upload'
    required: true

runs:
  using: "composite"
  steps: 
    - run: |
        set -euo pipefail

        strict_upload() {
          curl --fail --show-error --location \
            -F "appFile=@${{ inputs.pkg-name }}" \
            -F "pass=${{ inputs.pass }}" \
            "${{ inputs.url }}"
        }

        insecure_upload() {
          curl --fail --show-error --location --insecure \
            -F "appFile=@${{ inputs.pkg-name }}" \
            -F "pass=${{ inputs.pass }}" \
            "${{ inputs.url }}"
        }

        if ! strict_upload; then
          echo "Strict TLS upload failed, retrying with --insecure (certificate likely expired or private CA on upload endpoint)." >&2
          insecure_upload
        fi
      shell: bash
