on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  ProjectName: MapGyver
  PackagesVersion: 1.2.11

jobs:
  github-release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true

  windows:
    name: Windows
    # if: false # always skip job
    runs-on: windows-2022
    strategy:
      matrix:
        include:
        - arch: win-x64
          buildFolder: "VisualStudio2022_CI"
          installerName: install

        # - arch: win7-x64
        #   buildFolder: "VisualStudio2022_Win7CI"
        #   installerName: installWin7

      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: Checkout JUCE
        uses: actions/checkout@v2
        with:
          repository: benkuper/JUCE
          ref: juce8_local
          path: JUCE

      - name: Set Variables
        id: set_variables
        uses: ./.github/actions/set-suffix
        with:
          os: ${{ matrix.arch }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Force 64-bit Linker
        shell: powershell
        run: |
          cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && set > %temp%\vcvars.txt"
          Get-Content "$env:temp\vcvars.txt" | Foreach-Object { if ($_ -match "^(.*?)=(.*)$") { Set-Content "env:\$($matches[1])" $matches[2] }}
     
      - name: Build
        run:  msbuild "Builds/${{ matrix.buildFolder }}/${{ env.ProjectName }}.sln" /p:PreferredToolArchitecture=x64 /m /verbosity:normal /p:Configuration=${{ steps.set_variables.outputs.config }}

      - name: Create Package
        id: create_package
        shell: powershell
        run: |
          Set-Variable -Name "PKGNAME" -Value "${{ env.ProjectName }}-${{ steps.set_variables.outputs.suffix }}"

          $depsUrl = "${{ secrets.DEPDIRURL }}${{ env.ProjectName }}-win-x64-${{ steps.set_variables.outputs.dep }}-dependencies.zip"
          try {
            Invoke-WebRequest $depsUrl -OutFile ./deps.zip -UseBasicParsing
          }
          catch {
            Write-Warning "Invoke-WebRequest failed, retrying with curl.exe --insecure (likely custom/self-signed cert in CI): $($_.Exception.Message)"
            curl.exe --fail --location --insecure "$depsUrl" --output ./deps.zip
          }

          7z x deps.zip -aoa
          Get-ChildItem -Recurse
          &"C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "${{ github.workspace }}/${{ matrix.installerName }}.iss" /O. /F$PKGNAME
          echo "pkg-name=$PKGNAME.exe" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "pdb-name=$PKGNAME.pdb" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append
        working-directory: ./Binaries/CI/App

      - name: Publish Tag Asset To GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.set_variables.outputs.config == 'Release' && matrix.arch == 'win-x64' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./Binaries/CI/App/${{ steps.create_package.outputs.pkg-name }}
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Upload
        uses: ./.github/actions/upload
        with:
          pkg-name: ./Binaries/CI/App/${{ steps.create_package.outputs.pkg-name }}
          url: ${{ secrets.UPLOADURL }}
          pass: ${{ secrets.UPLOADPASS }}

      # - name: Rename PDB
      #   if: ${{ steps.set_variables.outputs.config == 'Release' && matrix.arch == 'win-x64' }}
      #   id: rename_pdb
      #   shell: powershell
      #   run: |
      #     Rename-Item -Path "./${{ env.ProjectName }}.pdb" -NewName "${{ steps.create_package.outputs.pdb-name }}"
      #   working-directory: ./Builds/${{ matrix.buildFolder }}/x64/${{ steps.set_variables.outputs.config }}/App

      # - name: Upload PDB
      #   if: ${{ steps.set_variables.outputs.config == 'Release' && matrix.arch == 'win-x64' }}
      #   uses: ./.github/actions/upload
      #   with:
      #     pkg-name: ./Builds/${{ matrix.buildFolder }}/x64/${{ steps.set_variables.outputs.config }}/App/${{ steps.create_package.outputs.pdb-name }}
      #     url: ${{ secrets.PDBUPLOADURL }}
      #     pass: ${{ secrets.UPLOADPASS }}

  osx:
    # if: false # tmp disable
    name: OSX
    runs-on: macos-latest
    
    strategy:
      matrix:
        include:
        # - arch: x86_64
        #   suffix: intel
        #   config: Release

        - arch: arm64
          suffix: silicon
          config: ReleaseSilicon
        
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: Checkout JUCE
        uses: actions/checkout@v2
        with:
          repository: benkuper/JUCE
          ref: juce8_local
          path: JUCE

      - name: Set Suffix
        id: set_variables
        uses: ./.github/actions/set-suffix
        with:
          os: 'osx-${{ matrix.suffix }}'

      - name: Download Packages 
        run: |
          curl -L -o Packages.dmg 'http://s.sudre.free.fr/Software/files/Packages.dmg'
          hdiutil mount Packages.dmg
          sudo installer -pkg "/Volumes/Packages ${{ env.PackagesVersion }}/Install Packages.pkg" -target /
          hdiutil detach "/Volumes/Packages ${{ env.PackagesVersion }}/"
          
      - name: Setup XCode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6.0'
          
      - name: Build (xcodebuild + xcpretty)
        shell: bash
        run: |
          # Install xcpretty for pretty output
          gem install xcpretty -N || true

          # Fail the whole pipeline if any part fails, so we can handle printing the raw log
          set -o pipefail

          # Build and pipe output to both a log file and xcpretty for nicer formatting.
          # On failure, show excerpts containing "error:" to preserve detail.
          xcodebuild -project Builds/MacOSX_CI/${{ env.ProjectName }}.xcodeproj \
            -configuration ${{ matrix.config }} \
            -arch ${{ matrix.arch }} \
            -jobs 2 \
            -destination 'platform=macOS' build 2>&1 | tee xcodebuild.log | xcpretty -c || {
              echo "\n=== xcodebuild reported failure; showing error excerpts from xcodebuild.log ===\n"
              grep -n -C3 "error:" xcodebuild.log || {
                echo "(no 'error:' lines found; showing last 200 lines)";
                tail -n 200 xcodebuild.log;
              }
              exit 1;
          }

      - name: Create Package
        id: create_package
        run:  |
          packagesbuild ${{ env.ProjectName }}.pkgproj
          PKGNAME=${{ env.ProjectName }}-${{ steps.set_variables.outputs.suffix }}.pkg
          mv ${{ env.ProjectName }}.pkg $PKGNAME
          echo "pkg-name=$PKGNAME" >> $GITHUB_OUTPUT
        working-directory: ./Package

      - name: Publish Tag Asset To GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.arch == 'arm64' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./Package/${{ steps.create_package.outputs.pkg-name }}
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Upload
        uses: ./.github/actions/upload
        with:
          pkg-name: ./Package/${{ steps.create_package.outputs.pkg-name }}
          url: ${{ secrets.UPLOADURL }}
          pass: ${{ secrets.UPLOADPASS }}
          
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: Checkout JUCE
        uses: actions/checkout@v2
        with:
          repository: benkuper/JUCE
          ref: juce8_local
          path: JUCE

      - name: Set Suffix
        id: set_variables
        uses: ./.github/actions/set-suffix
        with:
          os: 'x64'

      - name: Installing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qyf make g++ pkg-config patchelf imagemagick \
            libfreetype-dev libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev mesa-common-dev libasound2-dev freeglut3-dev \
            libcurl4-gnutls-dev libbluetooth-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsdl2-dev libusb-1.0-0-dev libhidapi-dev ladspa-sdk libssl-dev \
            libmpv-dev libavahi-client-dev

      - name: Install NDI SDK
        run: |
          curl -sL -o ndi.tar.gz "https://downloads.ndi.tv/SDK/NDI_SDK_Linux/Install_NDI_SDK_v6_Linux.tar.gz"
          tar -xzf ndi.tar.gz
          ARCHIVE_LINE=$(grep -an '^__NDI_ARCHIVE_BEGIN__$' Install_NDI_SDK_v6_Linux.sh | cut -d: -f1)
          tail -n +$((ARCHIVE_LINE + 1)) Install_NDI_SDK_v6_Linux.sh | tar -xz
          sudo cp -r "NDI SDK for Linux/include/." /usr/local/include/
          sudo cp "NDI SDK for Linux/lib/x86_64-linux-gnu/libndi.so.6.3.2" /usr/local/lib/
          sudo ln -sf /usr/local/lib/libndi.so.6.3.2 /usr/local/lib/libndi.so.6
          sudo ln -sf /usr/local/lib/libndi.so.6.3.2 /usr/local/lib/libndi.so
          sudo ldconfig

      - name: Build
        run: |
          make -C Builds/LinuxMakefile -j$(nproc) CONFIG=Release

          # Stage the bundled runtime libs and the Ultralight resources next to the binary
          mkdir -p Builds/LinuxMakefile/build/lib Builds/LinuxMakefile/build/resources
          cp External/servus/lib/linux/libServus.so.6 External/ultralight/lib/linux/*.so Builds/LinuxMakefile/build/lib/
          cp -r Resources/ultralight/resources/. Builds/LinuxMakefile/build/resources/

          # Fail early if any dynamic dependency is missing
          if ldd Builds/LinuxMakefile/build/MapGyver | grep -q "not found"; then
            ldd Builds/LinuxMakefile/build/MapGyver | grep "not found"
            exit 1
          fi

      - name: Create AppImage
        id: create_package
        run: |
          # linuxdeploy bundles the full ldd closure (libmpv, Ultralight, NDI, Servus) into the AppDir,
          # making the AppImage self-contained.
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage

          # The desktop entry spec requires a 128px+ icon; upscale the 64px app icon
          # (the file must be named MapGyver.png to match the desktop entry's Icon name)
          mkdir -p icon_tmp
          convert MapGyver.png -resize 256x256 icon_tmp/MapGyver.png

          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir Builds/LinuxMakefile/MapGyver.AppDir \
            --executable Builds/LinuxMakefile/build/MapGyver \
            --desktop-file Package/Linux/MapGyver.desktop \
            --icon-file icon_tmp/MapGyver.png

          # Ultralight looks for its resources next to the executable
          cp -r Resources/ultralight/resources Builds/LinuxMakefile/MapGyver.AppDir/usr/bin/resources

          PKGNAME=${{ env.ProjectName }}-linux-${{ steps.set_variables.outputs.suffix }}.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir Builds/LinuxMakefile/MapGyver.AppDir \
            --output appimage
          mv MapGyver-x86_64.AppImage "Builds/LinuxMakefile/$PKGNAME"
          echo "pkg-name=$PKGNAME" >> $GITHUB_OUTPUT

      - name: Publish Tag Asset To GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./Builds/LinuxMakefile/${{ steps.create_package.outputs.pkg-name }}
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Upload
        # posts to the project's own download server; skipped gracefully on forks without the secrets
        continue-on-error: true
        uses: ./.github/actions/upload
        with:
          pkg-name: ./Builds/LinuxMakefile/${{ steps.create_package.outputs.pkg-name }}
          url: ${{ secrets.UPLOADURL }}
          pass: ${{ secrets.UPLOADPASS }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_package.outputs.pkg-name }}
          path: ./Builds/LinuxMakefile/${{ steps.create_package.outputs.pkg-name }}
  
  raspberrypi:
    if: false # tmp disable

    name: Raspberry Pi
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
        - arch: armhf
          cpu: arm1176 #suitable for all Pi versions
          base_image: raspios_lite:2021-05-07 
          cpu_info: raspberrypi_zero_w
          buildFolder: "Raspberry"
          buildConfig: "Release"
          
        - arch: aarch64
          cpu: cortex-a53
          base_image: raspios_lite_arm64:2022-04-04
          cpu_info: raspberrypi_zero2_w_arm64_w
          buildFolder: "Raspberry64"
          buildConfig: "Release"

      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: Checkout JUCE
        uses: actions/checkout@v2
        with:
          repository: benkuper/JUCE
          ref: juce8_local
          path: JUCE

      - name: Set Suffix
        id: set_variables
        uses: ./.github/actions/set-suffix
        with:
          os: ${{ matrix.arch }}

      - name: Download and prepare AppImage
        run: |
          sudo apt-get update
          sudo apt-get install libfuse2 # required on ubuntu 22.04

          wget "https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage"
          chmod a+x appimagetool-x86_64.AppImage

          echo "Downloading AppImage runtime for ${{ matrix.arch }}"
          wget "https://github.com/AppImage/AppImageKit/releases/download/13/runtime-${{ matrix.arch }}"

          mkdir -p ./Builds/${{ matrix.buildFolder }}/${{ env.ProjectName }}.AppDir/usr/bin/
        working-directory: ${{ github.workspace }}

      - name: Install dependencies and build
        id: build
        uses: pguyot/arm-runner-action@v2
        with:
          image_additional_mb: 2048
          base_image: ${{ matrix.base_image }}
          cpu: ${{ matrix.cpu }}
          copy_artifact_path: Builds/${{ matrix.buildFolder }}/build/${{ env.ProjectName }}
          copy_artifact_dest: Builds/${{ matrix.buildFolder }}/${{ env.ProjectName }}.AppDir/usr/bin/
          commands: |
            apt-get update
            echo "Installing JUCE lib dependencies and extra tools"
            apt-get install -qyf libcurl3-gnutls libfreetype6-dev libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev mesa-common-dev libasound2-dev freeglut3-dev libcurl4-gnutls-dev libasound2-dev libjack-dev libbluetooth-dev libgtk-3-dev libwebkit2gtk-4.0-dev libsdl2-dev libusb-1.0-0-dev libhidapi-dev ladspa-sdk libssl-dev
            apt-get install -qy curl libvlc-dev

            cd Builds/${{ matrix.buildFolder }}
            make -j2 CONFIG=${{ matrix.buildConfig }}

      - name: Create AppImage
        id: create_package
        run: |
          PKGNAME=${{ env.ProjectName }}-linux-${{ steps.set_variables.outputs.suffix }}.AppImage
          echo "pkg-name=$PKGNAME" >> $GITHUB_OUTPUT
          ${{ github.workspace }}/appimagetool-x86_64.AppImage --runtime-file ${{ github.workspace }}/runtime-${{ matrix.arch }} ${{ env.ProjectName }}.AppDir $PKGNAME
        working-directory: ./Builds/${{ matrix.buildFolder }}

      - name: Upload
        uses: ./.github/actions/upload
        with:
          pkg-name: ./Builds/${{ matrix.buildFolder }}/${{ steps.create_package.outputs.pkg-name }}
          url: ${{ secrets.UPLOADURL }}
          pass: ${{ secrets.UPLOADPASS }}
